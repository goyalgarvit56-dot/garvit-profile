<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garvit Goyal | Connect With Me</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f7f7ff);
  color:#111827; padding:24px;
}
.card{
  width:100%; max-width:430px; background:#fff; border-radius:28px;
  padding:38px 26px 30px; text-align:center;
  box-shadow:0 18px 55px rgba(20,35,80,.14);
}
.avatar{
  width:88px;height:88px;border-radius:50%;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;font-size:30px;font-weight:800;
}
h1{font-size:28px;margin:0 0 8px}
p{color:#667085;margin:0 0 26px;font-size:15px}
a{
  display:block;text-decoration:none;color:#fff;font-weight:700;
  padding:16px 18px;border-radius:15px;margin:14px 0;
  transition:transform .15s ease,opacity .15s ease;
}
a:hover{transform:translateY(-2px);opacity:.93}
.insta{background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af)}
.linkedin{background:#0a66c2}
.footer{margin-top:22px;font-size:12px;color:#98a2b3}
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">GG</div>
    <h1>Garvit Goyal</h1>
    <p>Connect with me on social media</p>

    <a class="insta" href="https://www.instagram.com/garvit_rj_11_/" target="_blank" rel="noopener">
      📸 Instagram
    </a>

    <a class="linkedin" href="https://www.linkedin.com/in/garvit-goyal-3088322b1" target="_blank" rel="noopener">
      💼 LinkedIn
    </a>

    <div class="footer">Tap a button to open the profile</div>
  </main>
</body>
</html>
